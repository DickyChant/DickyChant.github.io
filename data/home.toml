[about]
title = 'Curious about the smallest scales and the largest datasets.'
body = 'I am an experimental particle physicist at Northwestern University and Fermilab, and a convener of CMS Offline Samples. My work connects collider measurements, physics-aware machine learning, detector simulation, and the infrastructure that turns collisions into analysis-ready datasets.'
note = 'The older CERN page described this as a superposition. The notation stays; the portfolio around it has caught up.'

