[hero]
eyebrow = 'Particle physics · machine learning · scientific computing'
title = 'Finding structure in collisions—and in the data they leave behind.'
intro = 'I develop physics-aware machine-learning methods, collider analyses, and reproducible tools for turning complex detector data into useful measurements.'
affiliation = 'Northwestern University × Fermilab'
